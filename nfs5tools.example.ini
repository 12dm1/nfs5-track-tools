; Copy to nfs5tools.ini (ignored by git) and set your folders.
; Environment variables NFS5_GAME, NFS4_ROOT, NFS5_WORK win over this file.
; Check with: python tools/track/nfs5cfg.py

[paths]
; Porsche Unleashed v3.5 (English). Stock files are read from here (templates, track.viv, Sky/*.bin);
; converted tracks are copied into it with --install.
game = D:/Games/Porsche Unleashed

; Need for Speed: High Stakes (PC). Needs Data/Tracks/<Track>/tr.frd, Data/Audio/Sfx/tram*.bnk, nfshs.exe.
; Default: <game>/NeedforSpeedHighStakes
nfs4 = D:/Games/Need for Speed High Stakes

; Scratch output: builds, reports, texture dumps, backups. Default: ./work
; work = ./work
